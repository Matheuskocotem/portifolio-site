<style>

:root[data-theme="dark"] { --bg: #10151D; --panel: #171E29; --ink: #E4E8EF; --muted: #A0A9B8; --faint: #6F7889;
  --line: #262F3D; --accent: #86AEEE; --accent-bg: #1B2638; --term: #0B0F15; color-scheme: dark; }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 2rem); scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 1.0625rem; line-height: 1.65; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-underline-offset: 3px; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

.layout { max-width: 72rem; margin: 0 auto; padding: 0 2rem; display: grid; grid-template-columns: 21rem 1fr; gap: 5rem; }
@media (max-width: 960px) { .layout { grid-template-columns: 1fr; gap: 0; padding: 0 1.5rem; } }

/* Left column */
.side { position: sticky; top: 0; height: 100vh; height: 100dvh; padding: 5rem 0 3rem; display: flex; flex-direction: column; }
@media (max-width: 960px) { .side { position: static; height: auto; padding: 4rem 0 1rem; } }
.side h1 { font-size: 2.75rem; line-height: 1.05; letter-spacing: -0.03em; margin: 0 0 0.6rem; font-weight: 700; }
.side .role { font-size: 1.2rem; font-weight: 500; margin: 0 0 1rem; }
.side .lede { color: var(--muted); margin: 0 0 0.9rem; max-width: 20rem; }
.side .place { color: var(--faint); font-size: 0.95rem; margin: 0; }
.toc { margin: 3rem 0 0; padding: 0; list-style: none; }
.toc a { display: flex; align-items: center; gap: 0.9rem; padding: 0.4rem 0; color: var(--faint); text-decoration: none; font-weight: 500; font-size: 0.95rem; }
.toc a::before { content: ""; width: 1.75rem; height: 1px; background: currentColor; transition: width .2s ease; }
.toc a:hover, .toc a.active { color: var(--ink); }
.toc a.active::before { width: 3.5rem; }
@media (max-width: 960px) { .toc { display: none; } }
.social { margin-top: auto; display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }
@media (max-width: 960px) { .social { margin-top: 1.75rem; } }
.social a { display: inline-flex; align-items: center; gap: 0.45rem; padding: 0.5rem 0.8rem; border: 1px solid var(--line); border-radius: 8px;
  color: var(--ink); text-decoration: none; font-size: 0.925rem; background: var(--panel); }
.social a:hover { border-color: var(--accent); color: var(--accent); }
.social svg { width: 1rem; height: 1rem; fill: currentColor; }
.theme { background: none; border: 0; color: var(--faint); cursor: pointer; font: inherit; font-size: 0.9rem; padding: 0.5rem 0.25rem; }
.theme:hover { color: var(--ink); }

/* Right column */
main { padding: 5rem 0 2rem; }
@media (max-width: 960px) { main { padding-top: 1rem; } }
section { margin-bottom: 6rem; }
h2 { font-size: 1.05rem; font-weight: 600; margin: 0 0 1.5rem; color: var(--ink); display: flex; align-items: center; gap: 1rem; }
h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.about p { margin: 0 0 1.1rem; color: var(--muted); max-width: 38rem; }
.about strong { color: var(--ink); font-weight: 600; }

/* Experience runner */
.runner { background: var(--term); color: var(--term-ink); border-radius: 12px; padding: 1.1rem 0.9rem 1.2rem;
  font-family: var(--mono); font-size: 0.84rem; line-height: 1.7; overflow-x: auto; box-shadow: 0 18px 40px -24px rgba(23,32,51,.55); }
.runner .cmd { color: var(--term-dim); margin: 0 0 0.75rem 0.45rem; }
.runner .cmd b { color: var(--term-ink); font-weight: 400; }
.jobs { list-style: none; margin: 0; padding: 0; }
.jobs button { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; padding: 0.35rem 0.45rem; border-radius: 5px;
  display: grid; grid-template-columns: auto 1fr auto; gap: 0.8rem; align-items: baseline; }
.jobs button:hover { background: rgba(255,255,255,0.06); }
.jobs button:focus-visible { outline: 2px solid var(--ok); }
.pass { background: var(--ok); color: #0B0F15; font-weight: 600; padding: 0 0.4rem; border-radius: 3px; font-size: 0.76rem; }
.jobs .co { font-weight: 600; }
.jobs .ti { color: var(--term-dim); }
.jobs .when { color: var(--term-dim); white-space: nowrap; }
.jobs .arrow { display: inline-block; color: var(--term-dim); margin-left: 0.35rem; transition: transform .15s ease; }
.jobs li.open .arrow { transform: rotate(90deg); }
.jobs .detail { display: none; padding: 0.25rem 0 0.9rem 3.95rem; color: #AEB6C3; }
.jobs li.open .detail { display: block; }
.jobs .detail ul { margin: 0.35rem 0 0; padding: 0; list-style: none; }
.jobs .detail li { position: relative; padding-left: 1.3rem; }
.jobs .detail li::before { content: "✓"; position: absolute; left: 0; color: var(--ok); }
.jobs .stack { margin-top: 0.5rem; color: var(--term-dim); }
.runner .summary { margin: 1rem 0 0 0.45rem; padding-top: 0.8rem; border-top: 1px dashed rgba(255,255,255,0.15); color: var(--term-dim); }
.runner .summary .ok { color: var(--ok); font-weight: 600; }
.hint { color: var(--faint); font-size: 0.9rem; margin: 0.75rem 0 0; }
.resume { display: inline-block; margin-top: 1.25rem; font-weight: 600; }
@media (max-width: 600px) { .jobs button { grid-template-columns: auto 1fr; } .jobs .when { grid-column: 2; } .jobs .detail { padding-left: 1.2rem; } }

/* Projects & articles rows */
.rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.5rem; }
.row { position: relative; display: grid; grid-template-columns: 7rem 1fr; gap: 1.5rem; padding: 1.25rem; margin: 0 -1.25rem; border-radius: 10px;
  border: 1px solid transparent; transition: background .15s ease, border-color .15s ease; }
.row:hover { background: var(--panel); border-color: var(--line); }
.row .side-meta { color: var(--faint); font-size: 0.875rem; padding-top: 0.2rem; }
.row h3 { margin: 0 0 0.4rem; font-size: 1.1rem; font-weight: 600; line-height: 1.35; }
.row h3 a { color: var(--ink); text-decoration: none; }
.row h3 a::after { content: ""; position: absolute; inset: 0; border-radius: 10px; }
.row:hover h3 a { color: var(--accent); }
.row p { margin: 0 0 0.75rem; color: var(--muted); font-size: 1rem; }
.tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0; padding: 0; list-style: none; }
.tags li { background: var(--accent-bg); color: var(--accent); font-size: 0.8rem; font-weight: 500; padding: 0.15rem 0.6rem; border-radius: 999px; }
.row .small { color: var(--faint); font-size: 0.875rem; }
@media (max-width: 600px) { .row { grid-template-columns: 1fr; gap: 0.3rem; } }

/* Skills */
.skills { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 1.5rem 2rem; }
.skills h3 { font-size: 0.95rem; margin: 0 0 0.6rem; font-weight: 600; }

footer { color: var(--faint); font-size: 0.9rem; padding: 0 0 4rem; max-width: 36rem; }
</style>
</head>

/* Dark mode */
const root = document.documentElement, btn = $("themeBtn");
const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
try { const t = localStorage.getItem("theme"); if (t) root.dataset.theme = t; } catch (e) {}
const label = () => btn.textContent = isDark() ? "Light mode" : "Dark mode";
label();
btn.addEventListener("click", () => {
  root.dataset.theme = isDark() ? "light" : "dark"; label();
  try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
});
</script>
</body>
</html>
